<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>小帳本圖示選擇</title>
<style>
  body { margin: 0; background: #EFE9E1; font-family: "Microsoft JhengHei", system-ui, sans-serif; color: #3d2f25; }
  .wrap { padding: 28px 32px; }
  h1 { margin: 0 0 22px; font-size: 26px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; }
  .card { background: #fff; border-radius: 22px; padding: 20px 14px 18px; text-align: center; box-shadow: 0 2px 10px rgba(80,50,20,.08); }
  .big { width: 168px; height: 168px; border-radius: 22.5%; display: block; margin: 0 auto; box-shadow: 0 3px 10px rgba(0,0,0,.12); }
  .num { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #3d2f25; color: #fff; font-weight: 700; font-size: 18px; margin-top: 16px; }
  .name { font-size: 20px; font-weight: 700; margin-top: 8px; }
  .desc { font-size: 14px; color: #7a6656; margin-top: 4px; min-height: 40px; line-height: 1.45; }
  .small { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e4d9cc; }
  .small img { width: 58px; height: 58px; border-radius: 22.5%; }
  .small .circle { border-radius: 50%; }
  .small span { font-size: 12px; color: #9a8676; }
</style>
</head>
<body><div class="wrap">
  <h1>小帳本・圖示五選一</h1>
  <div class="grid">
    <div class="card"><img class="big" src="1-handdrawn.svg"><div class="num">1</div><div class="name">手繪暖色</div><div class="desc">帳本＋金幣<br>咖啡色手繪線條</div><div class="small"><img src="1-handdrawn.svg"><img class="circle" src="1-handdrawn.svg"><span>主畫面<br>大小</span></div></div>
    <div class="card"><img class="big" src="2-flat.svg"><div class="num">2</div><div class="name">扁平極簡</div><div class="desc">陶土橘底<br>簡潔的錢包圖形</div><div class="small"><img src="2-flat.svg"><img class="circle" src="2-flat.svg"><span>主畫面<br>大小</span></div></div>
    <div class="card"><img class="big" src="3-piggy.svg"><div class="num">3</div><div class="name">可愛小豬</div><div class="desc">蜜桃色底<br>小豬撲滿存金幣</div><div class="small"><img src="3-piggy.svg"><img class="circle" src="3-piggy.svg"><span>主畫面<br>大小</span></div></div>
    <div class="card"><img class="big" src="4-watercolor.svg"><div class="num">4</div><div class="name">水彩暈染</div><div class="desc">金幣堆上長出嫩芽<br>存錢會長大</div><div class="small"><img src="4-watercolor.svg"><img class="circle" src="4-watercolor.svg"><span>主畫面<br>大小</span></div></div>
    <div class="card"><img class="big" src="5-seal.svg"><div class="num">5</div><div class="name">印章書法</div><div class="desc">朱紅印章<br>楷書「帳」字</div><div class="small"><img src="5-seal.svg"><img class="circle" src="5-seal.svg"><span>主畫面<br>大小</span></div></div>
  </div>
</div></body>
</html>
