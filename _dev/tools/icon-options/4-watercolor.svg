<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 風格 4：水彩 — 米白紙、暈染的金幣堆和發芽的小葉子（存錢會長大） -->
  <defs>
    <filter id="wc" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.35  0 0 0 0 0.2  0 0 0 0.06 0"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#FFF7EC"/>
  <rect width="512" height="512" filter="url(#grain)"/>

  <!-- 背景暈染 -->
  <g filter="url(#wc)">
    <circle cx="250" cy="268" r="168" fill="#FAD3AA" opacity=".55"/>
    <circle cx="290" cy="230" r="120" fill="#FCE2C2" opacity=".6"/>
  </g>
  <g transform="translate(256 266) scale(1.5) translate(-261 -244)">
    <!-- 顏料層 -->
    <g filter="url(#wc)" style="mix-blend-mode:multiply">
      <circle cx="200" cy="330" r="10" fill="#F3B062" opacity=".35"/>
      <circle cx="346" cy="200" r="7" fill="#F3B062" opacity=".35"/>
      <rect x="166" y="300" width="180" height="44" rx="22" fill="#E8853A" opacity=".9"/>
      <rect x="176" y="262" width="180" height="44" rx="22" fill="#EFA444" opacity=".9"/>
      <rect x="168" y="224" width="180" height="44" rx="22" fill="#F3B84E" opacity=".9"/>
      <ellipse cx="258" cy="230" rx="86" ry="18" fill="#FBDD98" opacity=".9"/>
      <path d="M262 170 C232 148 210 158 204 178 C226 192 250 188 262 170 Z" fill="#8DBF63" opacity=".85"/>
      <path d="M262 158 C288 124 324 128 334 148 C312 172 282 174 262 158 Z" fill="#7DB357" opacity=".85"/>
    </g>
    <!-- 鋼筆線稿（故意稍微錯開，像速寫） -->
    <g filter="url(#ink)" fill="none" stroke="#6B4A35" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="170" y="296" width="180" height="44" rx="22"/>
      <rect x="180" y="258" width="180" height="44" rx="22"/>
      <rect x="172" y="220" width="180" height="44" rx="22"/>
      <!-- 金幣邊緣刻紋 -->
      <path d="M200 306 v24 M224 306 v26 M248 306 v26 M272 306 v26 M296 306 v26 M320 306 v24
               M210 268 v24 M234 268 v26 M258 268 v26 M282 268 v26 M306 268 v26 M330 268 v24
               M202 240 v18 M226 242 v20 M250 242 v20 M274 242 v20 M298 242 v20 M322 240 v18" stroke-width="2.5" opacity=".7"/>
      <path d="M262 216 C258 196 260 180 264 164"/>
      <path d="M262 172 C234 152 212 162 206 180 C228 192 250 188 262 172"/>
      <path d="M264 160 C290 128 324 130 334 150 C312 172 284 174 264 160"/>
    </g>
  </g>
</svg>
